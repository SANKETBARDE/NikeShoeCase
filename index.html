<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Jordan - Loading</title>
    <link href="https://fonts.cdnfonts.com/css/norwester" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="--accent-color: #660413;">
    <div class="loader" id="loader">
        <div class="loader-logos">
            <img src="images/logo/nike.jpg" alt="Nike" class="nike-logo">
            <span class="logo-separator">|</span>
            <img src="images/logo/jordan.jpg" alt="Jordan" class="jordan-logo">
        </div>
        <div class="loader-text">
            <span id="loading-word">LOADING</span>
        </div>
        <div class="loader-bar">
            <div class="loader-progress" id="loader-progress"></div>
        </div>
    </div>
    <script>
        const loadingWord = document.getElementById('loading-word');
        const progressBar = document.getElementById('loader-progress');
        const loadingWords = ['LOADING', 'RUNNING', 'JUMPING', 'HOOPING', 'FLYING', 'DUNKING', 'SCORING'];
        let wordIndex = 0;
        let progress = 0;
        
        const wordInterval = setInterval(() => {
            wordIndex = (wordIndex + 1) % loadingWords.length;
            loadingWord.textContent = loadingWords[wordIndex];
        }, 400);
        
        const progressInterval = setInterval(() => {
            progress += Math.random() * 15;
            if (progress >= 100) {
                progress = 100;
                clearInterval(progressInterval);
            }
            progressBar.style.width = progress + '%';
        }, 200);
        
        window.addEventListener('load', () => {
            setTimeout(() => {
                clearInterval(wordInterval);
                progressBar.style.width = '100%';
                setTimeout(() => {
                    window.location.href = 'aj1-og-c.html';
                }, 300);
            }, 1500);
        });
    </script>
</body>
</html>
